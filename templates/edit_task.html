<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>

<body>

    <h1>Edit Task</h1>

    <form method="POST">

        <label>Task:</label>

        <input
            type="text"
            name="task"
            value="{{ task.task }}"
            required
        >

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
